<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>呂依涵的個人網站</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f5c8ff 0%, #8162c3 100%);
      font-family: "Noto Sans TC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }
    
    .cv-wrapper {
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    .cv-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <header></header>
  
  <main>
    <div class="cv-wrapper">
      <img src="assets/photo/呂依涵履歷.jpg" alt="呂依涵履歷">
    </div>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
