server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index myweb.html index.html;
    
    location / {
        try_files $uri $uri/ /myweb.html;
    }
    
    # 確保 CSS、JS 和圖片文件可以正確載入
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    error_page 404 /myweb.html;
}
